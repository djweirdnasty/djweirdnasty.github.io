<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self' https://identitytoolkit.googleapis.com https://securetoken.googleapis.com; upgrade-insecure-requests">
  <title>Reset Password | SOL: Sounds of Logan</title>
  <meta name="description" content="Reset your Sounds of Logan account password.">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/x-icon" sizes="16x16" href="/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#ff4d8f">
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      padding: 2rem 1rem;
    }
    .reset-wrap { max-width: 420px; margin: 0 auto; }
    .reset-header { text-align: center; margin-bottom: 1.5rem; }
    .reset-header img { width: 56px; height: 56px; border-radius: 50%; }
    .reset-header h1 { font-size: 1.8rem; margin: 0.5rem 0 0.25rem; }
    .reset-header p { color: #aaa; font-size: 0.95rem; }
    .card {
      background: #111;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 1.5rem;
    }
    label { display: block; margin: 0.9rem 0 0.3rem; font-size: 0.9rem; color: #ccc; }
    input[type="password"], input[type="email"] {
      width: 100%;
      padding: 0.6rem;
      border-radius: 8px;
      border: 1px solid #444;
      background: #000;
      color: #fff;
      font-size: 1rem;
    }
    .btn {
      display: inline-block;
      width: 100%;
      background: #ff4d8f;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.7rem 1.4rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      margin-top: 1.25rem;
    }
    .btn:disabled { opacity: 0.6; cursor: default; }
    .form-status { margin-top: 0.75rem; font-size: 0.9rem; min-height: 1.2em; }
    .back-link { display: block; text-align: center; margin-top: 1.25rem; color: #ff4d8f; text-decoration: none; font-size: 0.9rem; }
    .back-link:hover { text-decoration: underline; }
    .center-box { text-align: center; padding: 1rem; }
    .center-box p { color: #aaa; margin-bottom: 1rem; }
  </style>
</head>
<body>
  <div class="reset-wrap">
    <div class="reset-header">
      <img src="sol-logo.png" alt="SOL logo">
      <h1>Reset Password</h1>
      <p>Sounds of Logan</p>
    </div>

    <div id="loading-state" class="card center-box">
      <p>Verifying your reset link...</p>
    </div>

    <div id="invalid-state" class="card center-box" style="display:none;">
      <p id="invalid-message">This password reset link is invalid or has expired.</p>
      <a class="btn" href="sol.html">Back to Sign In</a>
    </div>

    <div id="reset-card" class="card" style="display:none;">
      <p style="color:#aaa; font-size:0.9rem;">Resetting password for <strong id="reset-email" style="color:#fff;"></strong></p>
      <form id="reset-form">
        <label for="new-password">New Password</label>
        <input id="new-password" type="password" placeholder="At least 6 characters" autocomplete="new-password" required minlength="6">

        <label for="confirm-password">Confirm New Password</label>
        <input id="confirm-password" type="password" placeholder="Re-enter new password" autocomplete="new-password" required minlength="6">

        <button type="submit" id="submit-btn" class="btn">Reset Password</button>
        <p id="form-status" class="form-status" aria-live="polite"></p>
      </form>
    </div>

    <div id="success-state" class="card center-box" style="display:none;">
      <p>Your password has been reset. You can now sign in with your new password.</p>
      <a class="btn" href="sol.html">Go to Sign In</a>
    </div>

    <a class="back-link" href="sol.html">&larr; Back to Sounds of Logan</a>
  </div>

  <script>
    var firebaseConfig = {
      apiKey: 'AIzaSyDWU2qcKFA3cxK6ofT0IOrO9ss8bj29ttU',
      authDomain: 'studio-3475382917-e5aaa.firebaseapp.com',
      projectId: 'studio-3475382917-e5aaa',
      storageBucket: 'studio-3475382917-e5aaa.firebasestorage.app',
      messagingSenderId: '268860816836',
      appId: '1:268860816836:web:8073ff3c8327ef12a97891'
    };
    firebase.initializeApp(firebaseConfig);
    var auth = firebase.auth();

    var loadingState = document.getElementById('loading-state');
    var invalidState = document.getElementById('invalid-state');
    var resetCard = document.getElementById('reset-card');
    var successState = document.getElementById('success-state');
    var formStatus = document.getElementById('form-status');
    var submitBtn = document.getElementById('submit-btn');

    function getParam(name) {
      return new URLSearchParams(window.location.search).get(name);
    }

    var mode = getParam('mode');
    var oobCode = getParam('oobCode');

    if (mode !== 'resetPassword' || !oobCode) {
      loadingState.style.display = 'none';
      invalidState.style.display = 'block';
    } else {
      auth.verifyPasswordResetCode(oobCode)
        .then(function(email) {
          loadingState.style.display = 'none';
          resetCard.style.display = 'block';
          document.getElementById('reset-email').textContent = email;
        })
        .catch(function(err) {
          loadingState.style.display = 'none';
          invalidState.style.display = 'block';
          document.getElementById('invalid-message').textContent =
            'This password reset link is invalid or has expired (' + (err.code || 'error') + '). Request a new one from the sign-in page.';
        });
    }

    document.getElementById('reset-form').addEventListener('submit', function(e) {
      e.preventDefault();
      var newPassword = document.getElementById('new-password').value;
      var confirmPassword = document.getElementById('confirm-password').value;

      if (newPassword.length < 6) {
        formStatus.textContent = 'Password must be at least 6 characters.';
        formStatus.style.color = '#ff4d8f';
        return;
      }
      if (newPassword !== confirmPassword) {
        formStatus.textContent = 'Passwords do not match.';
        formStatus.style.color = '#ff4d8f';
        return;
      }

      submitBtn.disabled = true;
      formStatus.textContent = 'Resetting...';
      formStatus.style.color = '#ffd860';

      auth.confirmPasswordReset(oobCode, newPassword)
        .then(function() {
          resetCard.style.display = 'none';
          successState.style.display = 'block';
        })
        .catch(function(err) {
          formStatus.textContent = 'Could not reset password (' + (err.code || 'error') + '): ' + err.message;
          formStatus.style.color = '#ff4d8f';
          submitBtn.disabled = false;
        });
    });
  </script>
</body>
</html>
