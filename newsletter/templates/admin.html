<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; upgrade-insecure-requests">
  <title>Newsletter Admin | DJWEIRDNASTY</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #0a0a0f; color: #eee; min-height: 100vh; }
    .container { max-width: 900px; margin: 0 auto; padding: 2rem 1rem; }
    h1 { color: #ff4fd8; text-shadow: 0 0 10px #ff4fd8; margin-bottom: 1rem; }
    h2 { color: #4fa8ff; margin: 1.5rem 0 0.75rem; }
    .login-box { background: #151522; border: 1px solid #2a2a3a; border-radius: 12px; padding: 2rem; max-width: 400px; margin: 3rem auto; }
    .login-box input { width: 100%; padding: 12px; margin: 0.5rem 0; border-radius: 8px; border: 1px solid #333; background: #1a1a2a; color: #eee; font-size: 1rem; }
    .login-box button { width: 100%; padding: 12px; border-radius: 999px; border: 2px solid #4fa8ff; background: linear-gradient(180deg, #4fa8ff, #1a5fd0); color: #ff4fd8; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 0.5rem; }
    .dashboard { display: none; }
    .stats { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
    .stat-card { background: #151522; border: 1px solid #2a2a3a; border-radius: 12px; padding: 1.5rem; flex: 1; min-width: 180px; text-align: center; }
    .stat-card .num { font-size: 2rem; font-weight: bold; color: #ff4fd8; }
    .stat-card .label { font-size: 0.85rem; color: #888; margin-top: 0.25rem; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 1.5rem; }
    th, td { padding: 0.6rem 0.75rem; text-align: left; border-bottom: 1px solid #2a2a3a; font-size: 0.9rem; }
    th { color: #4fa8ff; }
    .btn { display: inline-block; padding: 8px 18px; border-radius: 999px; border: none; cursor: pointer; font-size: 0.85rem; font-weight: bold; text-decoration: none; }
    .btn-primary { background: linear-gradient(180deg, #4fa8ff, #1a5fd0); color: #ff4fd8; border: 2px solid #4fa8ff; }
    .btn-danger { background: #2a1015; color: #ff5566; border: 1px solid #ff5566; }
    .btn-sm { padding: 5px 12px; font-size: 0.75rem; }
    .editor { background: #151522; border: 1px solid #2a2a3a; border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; }
    .editor input, .editor textarea { width: 100%; padding: 12px; margin: 0.5rem 0; border-radius: 8px; border: 1px solid #333; background: #1a1a2a; color: #eee; font-size: 1rem; }
    .editor textarea { min-height: 200px; font-family: monospace; }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 0.75rem; font-weight: bold; }
    .badge-draft { background: #2a2a1a; color: #ffd860; }
    .badge-sent { background: #1a2a1a; color: #60ff80; }
    .badge-sending { background: #1a1a2a; color: #4fa8ff; }
    .badge-scheduled { background: #2a1a2a; color: #ff4fd8; }
    .msg { padding: 0.75rem 1rem; border-radius: 8px; margin: 0.5rem 0; display: none; }
    .msg-ok { background: #1a2a1a; color: #60ff80; }
    .msg-err { background: #2a1015; color: #ff5566; }
    a { color: #4fa8ff; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Newsletter Admin</h1>

    <!-- Login -->
    <div class="login-box" id="loginBox">
      <h2>Login</h2>
      <input type="text" id="username" placeholder="Username">
      <input type="password" id="password" placeholder="Password">
      <button onclick="doLogin()">Login</button>
      <div class="msg msg-err" id="loginErr"></div>
    </div>

    <!-- Dashboard -->
    <div class="dashboard" id="dashboard">
      <div class="stats">
        <div class="stat-card"><div class="num" id="statSubs">0</div><div class="label">Subscribers</div></div>
        <div class="stat-card"><div class="num" id="statConfirmed">0</div><div class="label">Confirmed</div></div>
        <div class="stat-card"><div class="num" id="statCampaigns">0</div><div class="label">Campaigns</div></div>
      </div>

      <h2>New Campaign</h2>
      <div class="editor">
        <select id="templateSelect" onchange="loadTemplate()" style="width:100%;padding:12px;margin:0.5rem 0;border-radius:8px;border:1px solid #333;background:#1a1a2a;color:#eee;font-size:1rem;">
          <option value="">— Start from blank —</option>
        </select>
        <input type="text" id="campSubject" placeholder="Subject line">
        <textarea id="campBody" placeholder="Write your newsletter HTML here. Use {{name}} for subscriber name. {{unsubscribe_url}} will be auto-appended."></textarea>
        <label style="display:flex;align-items:center;gap:8px;font-size:0.9rem;color:#888;">
          <input type="datetime-local" id="campSchedule" style="padding:8px;border-radius:8px;border:1px solid #333;background:#1a1a2a;color:#eee;">
          Schedule for later (optional)
        </label>
        <button class="btn btn-primary" onclick="createCampaign()">Save Campaign</button>
        <div class="msg msg-ok" id="campMsg"></div>
      </div>

      <h2>Campaigns</h2>
      <table id="campTable">
        <thead><tr><th>ID</th><th>Subject</th><th>Status</th><th>Opens</th><th>Clicks</th><th>Actions</th></tr></thead>
        <tbody></tbody>
      </table>

      <h2>Subscribers</h2>
      <table id="subTable">
        <thead><tr><th>Email</th><th>Name</th><th>Confirmed</th><th>Joined</th><th>Actions</th></tr></thead>
        <tbody></tbody>
      </table>

      <p style="margin-top:2rem;"><a href="{{ website_url }}">Back to website</a></p>
    </div>
  </div>

  <script>
    let token = localStorage.getItem('nl_token') || '';

    async function doLogin() {
      const u = document.getElementById('username').value;
      const p = document.getElementById('password').value;
      const res = await fetch('/api/admin/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({username: u, password: p})
      });
      if (res.ok) {
        const data = await res.json();
        token = data.token;
        localStorage.setItem('nl_token', token);
        showDashboard();
      } else {
        document.getElementById('loginErr').style.display = 'block';
        document.getElementById('loginErr').textContent = 'Invalid credentials';
      }
    }

    function authHeaders() {
      return {'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json'};
    }

    async function showDashboard() {
      document.getElementById('loginBox').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      await Promise.all([loadSubs(), loadCampaigns(), loadTemplates()]);
    }

    let templates = {};
    async function loadTemplates() {
      const res = await fetch('/api/admin/templates', {headers: authHeaders()});
      if (!res.ok) return;
      const data = await res.json();
      const select = document.getElementById('templateSelect');
      data.templates.forEach(t => {
        templates[t.key] = t;
        const opt = document.createElement('option');
        opt.value = t.key;
        opt.textContent = t.name;
        select.appendChild(opt);
      });
    }

    function loadTemplate() {
      const key = document.getElementById('templateSelect').value;
      if (!key) return;
      const t = templates[key];
      document.getElementById('campSubject').value = t.subject;
      document.getElementById('campBody').value = t.body;
    }

    async function loadSubs() {
      const res = await fetch('/api/admin/subscribers', {headers: authHeaders()});
      if (!res.ok) return;
      const data = await res.json();
      document.getElementById('statSubs').textContent = data.count;
      const confirmed = data.subscribers.filter(s => s.confirmed).length;
      document.getElementById('statConfirmed').textContent = confirmed;
      const tbody = document.querySelector('#subTable tbody');
      tbody.innerHTML = data.subscribers.map(s =>
        `<tr><td>${s.email}</td><td>${s.name}</td><td>${s.confirmed ? '✅' : '⏳'}</td><td>${s.joined.slice(0,10)}</td>
         <td><button class="btn btn-danger btn-sm" onclick="deleteSub(${s.id})">Delete</button></td></tr>`
      ).join('');
    }

    async function loadCampaigns() {
      const res = await fetch('/api/admin/campaigns', {headers: authHeaders()});
      if (!res.ok) return;
      const data = await res.json();
      document.getElementById('statCampaigns').textContent = data.campaigns.length;
      const tbody = document.querySelector('#campTable tbody');
      tbody.innerHTML = data.campaigns.map(c =>
        `<tr><td>${c.id}</td><td>${c.subject}</td><td><span class="badge badge-${c.status}">${c.status}</span></td>
         <td>${c.opens}</td><td>${c.clicks}</td>
         <td>${c.status === 'draft' || c.status === 'scheduled' ? `<button class="btn btn-primary btn-sm" onclick="sendCamp(${c.id})">Send</button>` : ''}
             <button class="btn btn-danger btn-sm" onclick="deleteCamp(${c.id})">Delete</button></td></tr>`
      ).join('');
    }

    async function createCampaign() {
      const subject = document.getElementById('campSubject').value;
      const body = document.getElementById('campBody').value;
      if (!subject || !body) return;
      const schedInput = document.getElementById('campSchedule').value;
      let scheduled_at = null;
      if (schedInput) {
        scheduled_at = new Date(schedInput).toISOString();
      }
      const res = await fetch('/api/admin/campaigns', {
        method: 'POST', headers: authHeaders(),
        body: JSON.stringify({subject, body, scheduled_at})
      });
      if (res.ok) {
        document.getElementById('campMsg').style.display = 'block';
        document.getElementById('campMsg').textContent = scheduled_at ? 'Campaign scheduled!' : 'Campaign saved!';
        document.getElementById('campSubject').value = '';
        document.getElementById('campBody').value = '';
        document.getElementById('campSchedule').value = '';
        document.getElementById('templateSelect').value = '';
        await loadCampaigns();
        setTimeout(() => document.getElementById('campMsg').style.display = 'none', 3000);
      }
    }

    async function sendCamp(id) {
      if (!confirm('Send this campaign to all confirmed subscribers?')) return;
      const res = await fetch(`/api/admin/campaigns/${id}/send`, {method: 'POST', headers: authHeaders()});
      if (res.ok) {
        const data = await res.json();
        alert(data.message);
        await loadCampaigns();
      } else {
        const data = await res.json();
        alert(data.detail || 'Error sending campaign');
      }
    }

    async function deleteCamp(id) {
      if (!confirm('Delete this campaign?')) return;
      await fetch(`/api/admin/campaigns/${id}`, {method: 'DELETE', headers: authHeaders()});
      await loadCampaigns();
    }

    async function deleteSub(id) {
      if (!confirm('Delete this subscriber?')) return;
      await fetch(`/api/admin/subscribers/${id}`, {method: 'DELETE', headers: authHeaders()});
      await loadSubs();
    }

    if (token) showDashboard();
  </script>
</body>
</html>
