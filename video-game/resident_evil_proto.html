function setAim(clientX, clientY) {
  const r = canvas.getBoundingClientRect();
  mouse.x = (clientX - r.left) * (canvas.width / r.width);
  mouse.y = (clientY - r.top) * (canvas.height / r.height);
}

    size: 12,
    speed: lvl.zombieSpeed,
    health: lvl.zombieHealth,
    damage: lvl.zombieDamage,
    lastAttack: 0

  player.y = lvl.start.y;
  player.keys = 0;
  player.weapon = { ...pistol };
  bullets = [];
  showMessage(lvl.name + ': ' + (lvl.keysNeeded > 1 ? 'Find ' + lvl.keysNeeded + ' keys.' : 'Find the key. Escape.'), 2500);
}

  loadLevel(0);
}

  currentLevel++;

    player.won = true;
    showMessage('ALL LEVELS CLEARED! Press R to restart.', 5000);
    showAchievement();
  } else {
    loadLevel(currentLevel);
    showMessage('Level ' + currentLevel + ' cleared. Next floor.');
  }
}

function autoAim() {
  const px = player.x + player.size/2;
  const py = player.y + player.size/2;
  let best = Infinity, tx = mouse.x, ty = mouse.y;
  for (const z of zombies) {
    const zx = z.x + z.size/2, zy = z.y + z.size/2;
    const d = Math.hypot(px - zx, py - zy);
    if (d < best) { best = d; tx = zx; ty = zy; }
  }
  mouse.x = tx;
  mouse.y = ty;
}

function shoot() {
  if (player.dead || player.won) return;
  if (player.ammo <= 0) {
    showMessage('Out of ammo!');
    return;
  }
  const px = player.x + player.size/2;
  const py = player.y + player.size/2;
  const dx = mouse.x - px;
  const dy = mouse.y - py;
  const len = Math.hypot(dx, dy);
  if (len === 0) return;
  bullets.push({
    x: player.x + player.size/2, y: player.y + player.size/2,
    vx: (dx / len) * 500, vy: (dy / len) * 500,
    size: player.weapon.bulletSize,
    color: player.weapon.color,
    damage: player.weapon.damage,
    life: 1.2
  });
  player.ammo--;
}

function rectHit(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function moveEntity(ent, dx, dy) {
  ent.x += dx;
  const ew = ent.size, eh = ent.size;
  for (const w of walls) {
    if (rectHit({ x: ent.x, y: ent.y, w: ew, h: eh }, w)) {
      if (dx > 0) ent.x = w.x - ew;
      else if (dx < 0) ent.x = w.x + w.w;
    }
  }
  ent.y += dy;
  for (const w of walls) {
    if (rectHit({ x: ent.x, y: ent.y, w: ew, h: eh }, w)) {
      if (dy > 0) ent.y = w.y - eh;
      else if (dy < 0) ent.y = w.y + w.h;
    }
  }
  ent.x = Math.max(0, Math.min(world.w - ew, ent.x));
  ent.y = Math.max(0, Math.min(world.h - eh, ent.y));
}

function update(dt) {
  if (player.dead || player.won) return;
  const lvl = levels[currentLevel];

  // Move player
  let mdx = 0, mdy = 0;
  if (input.w || input.ArrowUp)    mdy -= 1;
  if (input.s || input.ArrowDown)  mdy += 1;
  if (input.a || input.ArrowLeft)  mdx -= 1;
  if (input.d || input.ArrowRight) mdx += 1;
  if (mdx !== 0 || mdy !== 0) {
    const len = Math.hypot(mdx, mdy);
    mdx = (mdx / len) * player.speed * dt;
    mdy = (mdy / len) * player.speed * dt;
    moveEntity(player, mdx, mdy);
  }

  const playerRect = { x: player.x, y: player.y, w: player.size, h: player.size };

  // Door
  if (rectHit(playerRect, door)) {
    if (player.keys < lvl.keysNeeded) {
      if (mdx > 0) player.x = door.x - player.size;
      if (mdx < 0) player.x = door.x + door.w;
      if (mdy > 0) player.y = door.y - player.size;
      if (mdy < 0) player.y = door.y + door.h;
      showMessage('Locked. Need ' + lvl.keysNeeded + ' keys.');
    } else {
      nextLevel();
      return;
    }
  }

  // Items
  for (const it of items) {
    if (it.taken) continue;
    const dist = Math.hypot(player.x + player.size/2 - it.x, player.y + player.size/2 - it.y);
    if (dist < player.size/2 + it.size) {
      it.taken = true;
      if (it.type === 'key') {
        player.keys++;
        showMessage('Key acquired! (' + player.keys + '/' + lvl.keysNeeded + ')');
      }
      if (it.type === 'ammo') {
        player.ammo += it.amount;
        showMessage('Ammo + ' + it.amount);
      }
      if (it.type === 'med') {
        player.health = Math.min(player.maxHealth, player.health + it.amount);
        showMessage('Medkit + ' + it.amount);
      }
      if (it.type === 'weapon') {
        player.weapon = { ...it.weapon };
        player.ammo += it.amount || 0;
        showMessage(it.weapon.name + ' acquired!');
      }
    }
  }

  // Zombies
  const now = performance.now();

  // Mobile auto-fire
  if (fireHeld && now - lastShot > 250) {
    autoAim();
    shoot();
    lastShot = now;
  }

  for (let i = zombies.length - 1; i >= 0; i--) {
    const z = zombies[i];
    const zx = z.x + z.size/2, zy = z.y + z.size/2;
    const px = player.x + player.size/2, py = player.y + player.size/2;
    const dist = Math.hypot(px - zx, py - zy);

    if (dist < 220) {
      const zx_dir = (px - zx) / dist;
      const zy_dir = (py - zy) / dist;
      moveEntity(z, zx_dir * z.speed * dt, zy_dir * z.speed * dt);
    } else {
      const a = now * 0.001 + i;
      moveEntity(z, Math.sin(a) * z.speed * 0.3 * dt, Math.cos(a) * z.speed * 0.3 * dt);
    }

    // Attack
    if (dist < player.size/2 + z.size/2 + 4 && now - z.lastAttack > 900) {
      player.health -= z.damage;
      z.lastAttack = now;
      if (player.health <= 0) {
        player.dead = true;
        showMessage('YOU DIED. Press R.', 5000);
      }
    }
  }

  // Bullets
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.life -= dt;
    let remove = b.x < 0 || b.y < 0 || b.x > world.w || b.y > world.h || b.life <= 0;
    for (const w of walls) if (rectHit({ x: b.x, y: b.y, w: b.size, h: b.size }, w)) { remove = true; break; }
    for (let j = zombies.length - 1; j >= 0; j--) {
      const z = zombies[j];
      if (rectHit({ x: b.x, y: b.y, w: b.size, h: b.size }, { x: z.x, y: z.y, w: z.size, h: z.size })) {
        z.health -= b.damage;
        remove = true;
        if (z.health <= 0) zombies.splice(j, 1);
        break;
      }
    }
    if (remove) bullets.splice(i, 1);
  }

  if (now > messageUntil) message = '';
}

function draw() {
  ctx.fillStyle = '#111';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = '#444';
  for (const w of walls) ctx.fillRect(w.x, w.y, w.w, w.h);

  // Door
  const lvl = levels[currentLevel];
  ctx.fillStyle = player.keys >= lvl.keysNeeded ? '#282' : '#642';
  ctx.fillRect(door.x, door.y, door.w, door.h);
  ctx.strokeStyle = '#000';
  ctx.strokeRect(door.x, door.y, door.w, door.h);
  if (player.keys < lvl.keysNeeded) {
    ctx.fillStyle = '#0f0';
    ctx.font = '10px Courier New';
    ctx.fillText('LOCKED', door.x - 10, door.y + 60);
  }

  // Items
  for (const it of items) {
    if (it.taken) continue;
    if (it.type === 'key')    ctx.fillStyle = '#ff0';
    else if (it.type === 'ammo') ctx.fillStyle = '#00f';
    else if (it.type === 'med')  ctx.fillStyle = '#fff';
    else if (it.type === 'weapon') { ctx.fillStyle = '#f0f'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; }
    ctx.fillRect(it.x - it.size/2, it.y - it.size/2, it.size, it.size);
    if (it.type === 'weapon') ctx.strokeRect(it.x - it.size/2, it.y - it.size/2, it.size, it.size);
  }

  // Bullets
  for (const b of bullets) {
    ctx.fillStyle = b.color;
    ctx.fillRect(b.x, b.y, b.size, b.size);
  }

  // Zombies
  for (const z of zombies) {
    ctx.fillStyle = '#a33';
    ctx.fillRect(z.x, z.y, z.size, z.size);
  }

  // Player
  ctx.fillStyle = player.dead ? '#555' : '#3a3';
  ctx.fillRect(player.x, player.y, player.size, player.size);

  // Crosshair
  ctx.strokeStyle = '#0f0';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(mouse.x, mouse.y, 6, 0, Math.PI*2);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(mouse.x - 10, mouse.y);
  ctx.lineTo(mouse.x + 10, mouse.y);
  ctx.moveTo(mouse.x, mouse.y - 10);
  ctx.lineTo(mouse.x, mouse.y + 10);
  ctx.stroke();

  // HUD
  ctx.fillStyle = '#0f0';
  ctx.font = '14px Courier New';
  const keyText = 'KEYS: ' + player.keys + '/' + lvl.keysNeeded;
  const hud = `LV: ${currentLevel + 1}  HP: ${Math.max(0, player.health)}  AMMO: ${player.ammo}  ${keyText}  GUN: ${player.weapon.name}`;
  ctx.fillText(hud, 10, 20);
  if (message) ctx.fillText(message, 10, 460);
}

let last = performance.now();
function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
restart();
requestAnimationFrame(loop);
</script>
  <div id="achievement">
    <div class="badge">&#127942;</div>
    <h2>Achievement Unlocked</h2>
    <p>You cleared all 10 stages of YOUIE.</p>
  </div>
  </main>
  <section id="game-comments">
    <h2>Player Feedback</h2>
    <form action="mailto:kurtisctabb@gmail.com" method="post" enctype="text/plain">
      <input type="text" name="name" placeholder="Your name" required>
      <input type="email" name="email" placeholder="Your email" required>
      <textarea name="message" rows="4" placeholder="What do you think of YOUIE?" required></textarea>
      <button type="submit">Send Feedback</button>
    </form>
  </section>
