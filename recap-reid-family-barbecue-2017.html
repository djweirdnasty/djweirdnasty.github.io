<script>
  var recapTimers = {};

  function recapCarousel(id, dir) {
    var c = document.getElementById(id);
    var track = c.querySelector('.recap-carousel-track');
    var imgs = track.querySelectorAll('img');
    var total = imgs.length;
    var current = parseInt(c.dataset.current || '0', 10);
    current = (current + dir + total) % total;
    c.dataset.current = current;
    track.style.transform = 'translateX(-' + current * 100 + '%)';
    var counter = document.getElementById(id + '-counter');
    if (counter) counter.textContent = (current + 1) + ' / ' + total;
  }

  function recapStartAuto(id, interval) {
    recapStopAuto(id);
    recapTimers[id] = setInterval(function() { recapCarousel(id, 1); }, interval || 4000);
  }

  function recapStopAuto(id) {
    if (recapTimers[id]) { clearInterval(recapTimers[id]); delete recapTimers[id]; }
  }

  function recapLightbox(src) {
    var lb = document.getElementById('recap-lightbox');
    var lbImg = document.getElementById('recap-lightbox-img');
    lbImg.src = src;
    lb.classList.add('active');
  }

  function recapCloseLightbox() {
    document.getElementById('recap-lightbox').classList.remove('active');
  }

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') recapCloseLightbox();
    var c = document.getElementById('reid-bbq-carousel');
    if (!c) return;
    if (e.key === 'ArrowLeft') recapCarousel('reid-bbq-carousel', -1);
    if (e.key === 'ArrowRight') recapCarousel('reid-bbq-carousel', 1);
  });

  (function() {
    var c = document.getElementById('reid-bbq-carousel');
    if (!c) return;
    var track = c.querySelector('.recap-carousel-track');
    var imgs = track.querySelectorAll('img');
    imgs.forEach(function(img) {
      img.style.cursor = 'zoom-in';
      img.addEventListener('click', function() {
        recapLightbox(img.src);
      });
    });
    c.addEventListener('mouseenter', function() { recapStopAuto('reid-bbq-carousel'); });
    c.addEventListener('mouseleave', function() { recapStartAuto('reid-bbq-carousel'); });
    recapStartAuto('reid-bbq-carousel', 4000);
  })();
</script>
