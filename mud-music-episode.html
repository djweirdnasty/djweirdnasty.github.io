  <script>
    const mPlayer = document.getElementById('mEpisodePlayer');
    const mTitle = document.getElementById('mEpisodeTitle');
    const mCountdown = document.getElementById('mEpisodeCountdown');
    const mList = document.getElementById('mEpisodeList');
    const mShare = document.getElementById('mEpisodeShare');

    function getSlug() {
      return window.location.hash.replace('#', '') || mudEpisodes[0].slug;
    }

    function findEpisodeIndex(slug) {
      const found = mudEpisodes.findIndex(ep => ep.slug === slug);
      return found >= 0 ? found : 0;
    }

    function updateShare(ep, index) {
      if (!mShare) return;
      const num = index + 1;
      mShare.setAttribute('data-title', ep.title);
      mShare.setAttribute('data-url', 'https://djweirdnasty.com/mud-music-episode-' + num + '.html');
    }

    function buildList(activeIndex) {
      mList.querySelectorAll('.episode-list-item').forEach(function(el) { el.remove(); });
      mudEpisodes.forEach(function(ep, i) {
        const a = document.createElement('a');
        a.className = 'episode-list-item' + (i === activeIndex ? ' active' : '');
        a.href = '#' + ep.slug;
        a.innerHTML = '<img loading="lazy" src="mud-music-logo.webp" alt="' + ep.title + '" class="episode-thumb" />' +
          '<span class="episode-title">' + ep.title + '</span>';
        mList.appendChild(a);
      });
    }

    function loadEpisode() {
      const index = findEpisodeIndex(getSlug());
      const ep = mudEpisodes[index];
      mPlayer.src = ep.src;
      mPlayer.load();
      mTitle.textContent = ep.title;
      mCountdown.innerHTML = ep.countdown.map(item => '<li>' + item + '</li>').join('');
      buildList(index);
      updateShare(ep, index);
      if (history && history.replaceState) {
        history.replaceState(null, null, '#' + ep.slug);
      }
    }

    window.addEventListener('hashchange', loadEpisode);
    loadEpisode();

    if (mShare) {
      mShare.addEventListener('click', function() {
        const url = this.getAttribute('data-url') || window.location.href;
        const title = this.getAttribute('data-title') || document.title;
        if (window.gtag) gtag('event', 'share', { event_label: title, page_location: url });

        if (navigator.share) {
          navigator.share({ title: title, url: url }).catch(function() {});
        } else if (navigator.clipboard) {
          navigator.clipboard.writeText(url).then(function() {
            alert('Link copied to clipboard!');
          });
        } else {
          prompt('Copy this link to share:', url);
        }
      });
    }
  </script>
