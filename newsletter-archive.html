  <script>
    (function() {
      var NEWSLETTER_API_URL = 'https://djweirdnasty-newsletter.onrender.com';
      var list = document.getElementById('archive-list');
      var detailCache = {};

      function formatDate(iso) {
        if (!iso) return '';
        var d = new Date(iso);
        return d.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
      }

      fetch(NEWSLETTER_API_URL + '/api/newsletter/archive')
        .then(function(r) { if (!r.ok) throw new Error('bad'); return r.json(); })
        .then(function(data) {
          var issues = data.issues || [];
          if (!issues.length) {
            list.innerHTML = '<li class="archive-empty">No newsletter issues have been sent yet. Check back soon!</li>';
            return;
          }
          list.innerHTML = '';
          issues.forEach(function(issue) {
            var li = document.createElement('li');
            li.className = 'archive-item';
            li.innerHTML =
              '<h3>' + issue.subject + '</h3>' +
              '<p class="archive-date">' + formatDate(issue.sent_at) + '</p>' +
              '<div class="archive-body" id="archive-body-' + issue.id + '"></div>';
            li.addEventListener('click', function(e) {
              if (e.target.closest('a')) return;
              var body = document.getElementById('archive-body-' + issue.id);
              var isOpen = body.classList.contains('open');
              document.querySelectorAll('.archive-body.open').forEach(function(b) { b.classList.remove('open'); });
              if (isOpen) return;
              body.classList.add('open');
              if (detailCache[issue.id]) return;
              body.innerHTML = '<p style="color:#999;">Loading...</p>';
              fetch(NEWSLETTER_API_URL + '/api/newsletter/archive/' + issue.id)
                .then(function(r) { return r.json(); })
                .then(function(detail) {
                  detailCache[issue.id] = true;
                  var iframe = document.createElement('iframe');
                  body.innerHTML = '';
                  body.appendChild(iframe);
                  var doc = iframe.contentWindow.document;
                  doc.open();
                  doc.write(detail.body);
                  doc.close();
                })
                .catch(function() { body.innerHTML = '<p style="color:#ff5566;">Could not load this issue.</p>'; });
            });
            list.appendChild(li);
          });
        })
        .catch(function() {
          list.innerHTML = '<li class="archive-empty">Could not load the newsletter archive. Please try again later.</li>';
        });
    })();
  </script>
